name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-free:
    name: dependency-free checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run check scripts
        run: |
          for f in check_engine check_memory check_preemption check_metrics \
                   check_benchmark check_policies check_prefix_cache check_visualizations; do
            python "scripts/$f.py"
          done
